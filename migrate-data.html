<!doctype html>
<html lang="ar" dir="rtl"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="requires-role" content="admin"><title>ترحيل البيانات — الصقري</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <script src="js/safe-render.js"></script><script src="js/guard.js"></script>
  <script type="module" src="js/firebase-config-cdn.js"></script>
</head><body class="bg-light"><main class="container py-5" style="max-width:720px">
  <h1 class="h3">ترحيل البيانات إلى بنية الأداء الجديدة</h1>
  <p class="text-muted">تضيف الحقول الجديدة فقط ولا تحذف أو تغير بيانات الفواتير الأصلية.</p>
  <button id="run" class="btn btn-primary">بدء الترحيل وإعادة بناء الملخصات</button>
  <pre id="output" class="bg-dark text-light p-3 mt-3 rounded" style="min-height:160px;white-space:pre-wrap"></pre>
</main><script>
const output = document.getElementById('output');
const write = text => { output.textContent += text + '\n'; };
document.getElementById('run').addEventListener('click', async () => {
  const button = document.getElementById('run'); button.disabled = true; output.textContent = '';
  try {
    for (const collection of ['phones','accessories','sales','maintenanceJobs']) {
      let afterId = null, total = 0;
      do {
        const result = await window.firebaseCall('migrateCollectionBatch', { collection, afterId, batchSize: 200 });
        total += result.processed; afterId = result.nextAfterId;
        write(`${collection}: ${total} سجلًا`);
        if (result.done) break;
      } while (afterId);
    }
    const summaries = await window.firebaseCall('rebuildAllSummaries', {});
    write(`اكتمل: ${summaries.sales} فاتورة، ${summaries.days} يومًا، ${summaries.months} شهرًا.`);
  } catch (error) { write('فشل: ' + (error.message || error)); }
  finally { button.disabled = false; }
});
</script></body></html>
