<body>

  <!-- شريط التنقل -->
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <span class="navbar-brand">الصقري للاتصالات</span>

<div class="container mt-4">
  <!-- Simple Header -->
  <div class="row mb-4">
    <div class="col-12">
      <h2 class="text-center mb-3">
        <i class="fas fa-search text-primary"></i> البحث في المخزون
      </h2>
    </div>
  </div>

  <!-- Simple Search Form -->
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card">
        <div class="card-body">
          <!-- واجهة فقط: لا إرسال لخادم -->
          <form id="searchForm" action="#" onsubmit="handleSearch(event)">
            <div class="row">
              <div class="col-md-8">
                <div class="mb-3">
                  <label for="search_term" class="form-label">كلمة البحث</label>
                  <input type="text" class="form-control form-control-lg arabic-number-field" id="search_term" name="search_term"
                         placeholder="أدخل الباركود، الرقم التسلسلي، اسم المنتج، الماركة، الموديل...">
                </div>
              </div>
              <div class="col-md-4">
                <div class="mb-3">
                  <label for="search_type" class="form-label">نوع البحث</label>
                  <select class="form-select form-select-lg" id="search_type" name="search_type">
                    <option value="all">الكل</option>
                    <option value="phones">الهواتف</option>
                    <option value="accessories">الأكسسوارات</option>
                  </select>
                </div>
              </div>
            </div>
            <div class="text-center">
              <button type="submit" class="btn btn-primary btn-lg px-4">
                <i class="fas fa-search"></i> بحث
              </button>
              <button type="button" class="btn btn-secondary btn-lg px-4 ms-2" onclick="loadAllData()">
                <i class="fas fa-list"></i> عرض أحدث العناصر

        </div>
      </div>
    </div>
  </div>

  <!-- Search Results -->
  <div id="results_wrap" class="row mt-4 d-none">
    <div class="col-12">
      <div class="card">
        <div class="card-header bg-success text-white">
          <h5 class="mb-0">
            <i class="fas fa-list"></i>
            نتائج البحث (<span id="results_count">0</span>)
          </h5>
        </div>
        <div class="card-body" id="results_body">
          <!-- يتم ملؤه ديناميكياً -->
        </div>
      </div>

<!-- مكتبات JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Firebase Integration -->
<script type="module" src="js/firebase-config-cdn.js?v=20260119"></script>
<script type="module" src="js/firebase-database-cdn.js?v=20260910-2"></script>
<script type="module" src="js/firebase-storage-manager.js?v=20260119"></script>
<script type="module" src="js/repositories.js?v=20260910-2"></script>

<!-- Firebase Search Integration -->
<script>
  // ===== متغيرات البيانات =====
  let allPhones = [];
  let allAccessories = [];
  let allSales = [];
  
  // ===== متغيرات الصفحات =====
  const ITEMS_PER_PAGE = 20;
  let currentPage = 1;
  let totalPages = 1;
  let currentSearchResults = { phones: [], accessories: [] };

  // ===== دعم الأرقام العربية (التعريفات الكاملة في قسم التحويل أدناه) =====
  function parseArabicNumber(value) {
    if (!value || value.trim() === '') return 0;
    const converted = convertArabicToEnglishNumbers(value.toString());
    const num = parseFloat(converted);
    return isNaN(num) ? 0 : num;
  }
  
  function setupArabicNumberSupport() {
    document.querySelectorAll('.arabic-number-field').forEach(field => {
      field.addEventListener('input', function() {
        const pos = this.selectionStart;
        const cv = convertArabicToEnglishNumbers(this.value);
        if (cv !== this.value) {
          this.value = cv;
          this.setSelectionRange(pos, pos);
        }
      });
    });
  }

  // ===== الأدوات =====
  const fmtMoney = n => (Number(n)||0).toFixed(2);
  // وسيطة JavaScript آمنة داخل خاصية HTML؛ JSON يحمي الاقتباسات وescapeHTML
  // يمنع خروج القيمة من الخاصية نفسها.
  const actionArg = value => escapeHTML(JSON.stringify(String(value ?? '')));

  // ===== تحويل الأرقام العربية إلى إنجليزية =====
  function convertArabicToEnglishNumbers(str) {
    if (!str) return '';
    const map = {
      '٠': '0', '١': '1', '٢': '2', '٣': '3', '٤': '4',
      '٥': '5', '٦': '6', '٧': '7', '٨': '8', '٩': '9'
    };
    return str.toString().replace(/[٠-٩]/g, m => map[m] || m);
  }

  // ===== تحويل الأرقام الإنجليزية إلى عربية =====
  function convertEnglishToArabicNumbers(str) {
    if (!str) return '';
    const map = {
      '0': '٠', '1': '١', '2': '٢', '3': '٣', '4': '٤',
      '5': '٥', '6': '٦', '7': '٧', '8': '٨', '9': '٩'
    };
    return str.toString().replace(/[0-9]/g, m => map[m] || m);
  }

  // ===== هل الهاتف مباع؟ (نفس منطق صفحة المبيعات مع شوية مرونة في الحقول) =====
  function isPhoneSold(phoneId) {
    if (!phoneId) return false;

    // علم sold على مستند الهاتف أولًا (متاح بعد تشغيل migrateSoldFlags)
    const phone = allPhones.find(p => p.id === phoneId || p.phone_number === phoneId ||
      p.serial_number === phoneId || p.device_number === phoneId);
    if (phone && typeof phone.sold === 'boolean') return phone.sold;

    if (!allSales || allSales.length === 0) return false;

    // استبعدنا العمليات المسترجعة
    const effectiveSales = allSales.filter(s => s && s.returned !== true && s.status !== 'مسترجعة');

    // ابحث عن هاتف ضمن items يطابق المعرّف
    return effectiveSales.some(sale =>
      Array.isArray(sale.items) &&
      sale.items.some(item => {
        const isPhoneType =
          item.type === 'phone' ||
          item.product_type === 'phone' ||
          item.type === 'هاتف';

        const candidateIds = [
          item.id,
          item.phone_id,
          item.barcode,
          item.phone_number,
          item.device_number,
          item.serial_number
        ].filter(Boolean).map(String);

        return isPhoneType && candidateIds.includes(String(phoneId));
      })
    );
  }


  // (تمت إزالة عناصر نوع البحث وحالة الهاتف من واجهة البحث)

  // ===== منطق البحث من قاعدة البيانات =====
  // البيانات تُجلب مرة واحدة لكل زيارة صفحة ثم تُفلتر في الذاكرة —
  // كل بحث إضافي لا يكلف أي قراءة جديدة من Firestore
  let inventoryDataLoaded = false;
  let inventoryLoadedAt = 0;
  const INVENTORY_REFRESH_MS = 30 * 1000;

  async function getRepositories() {
    // ملفات Firebase من نوع module؛ ننتظر تهيئتها بشكل صريح بدلاً من فشل
    // البحث إذا ضغط المستخدم الزر مباشرة عند فتح الصفحة.
    for (let attempt = 0; attempt < 20; attempt += 1) {
      if (window.dataRepositories?.phonesRepository && window.dataRepositories?.accessoriesRepository) {
        return window.dataRepositories;
      }
      await new Promise(resolve => setTimeout(resolve, 50));
    }
    throw new Error('تعذر تهيئة قاعدة البيانات. تحقق من الاتصال ثم أعد تحميل الصفحة.');
  }

  // بديل آمن لمسار «عرض الكل» القديم: يعرض أحدث صفحة من كل نوع فقط،
  // ولا يعيد تنزيل جميع سجلات المخزون إلى المتصفح.
  async function loadAllData() {
    try {
      const repositories = await getRepositories();
      const [phonesPage, accessoriesPage] = await Promise.all([
        repositories.phonesRepository.getPage({ pageSize: ITEMS_PER_PAGE }),
        repositories.accessoriesRepository.getPage({ pageSize: ITEMS_PER_PAGE })
      ]);
      allPhones = phonesPage.items || [];
      allAccessories = accessoriesPage.items || [];
      allSales = [];
      currentSearchResults = { phones: allPhones, accessories: allAccessories };
      currentPage = 1;
      renderResults(allPhones, allAccessories);
    } catch (error) {
      console.error('❌ خطأ في تحميل أحدث عناصر المخزون:', error);
      showAlert('danger', 'تعذر تحميل عناصر المخزون. تحقق من الاتصال ثم حاول مجدداً.');
    }
  }

  async function handleSearch(e){
    e.preventDefault();
    const term = (document.getElementById('search_term').value || '').trim();
    const type = document.getElementById('search_type').value || 'all';
    const statusFilter = 'all';


    if (!term) {
      showAlert('warning', 'يرجى إدخال كلمة البحث');
      return;
    }

    try {
      const repositories = await getRepositories();
      // بحث خادمي محدود؛ لا ننزل المخزون أو المبيعات كاملةً إلى المتصفح.
      [allPhones, allAccessories] = await Promise.all([
        type === 'all' || type === 'phones' ? repositories.phonesRepository.search(term, { pageSize: 50 }) : Promise.resolve([]),
        type === 'all' || type === 'accessories' ? repositories.accessoriesRepository.search(term, { pageSize: 50 }) : Promise.resolve([])
      ]);
      allSales = [];

      // لم نعد نحتاج Set لأننا سنستخدم isPhoneSold مباشرة

      // تحويل الأرقام العربية إلى إنجليزية للبحث
      const englishTerm = convertArabicToEnglishNumbers(term);
      const arabicTerm = convertEnglishToArabicNumbers(term);
      
      // البحث في كلا النسختين (عربية وإنجليزية)
      const searchTerms = [term.toLowerCase(), englishTerm.toLowerCase(), arabicTerm.toLowerCase()];
      const uniqueTerms = [...new Set(searchTerms)]; // إزالة التكرار
      

      let phones = [];
      let accessories = [];

      if (type === 'all' || type === 'phones') {
        phones = allPhones.filter(p => {
          
          // البحث في النص مع دعم الأرقام العربية والإنجليزية
          // إضافة serial_number إلى البحث
          const searchText = `${p.phone_number || ''} ${p.serial_number || ''} ${p.manufacturer || p.brand || ''} ${p.model || ''} ${p.condition || p.phone_type || ''}`.toLowerCase();
          const englishSearchText = convertArabicToEnglishNumbers(searchText);
          const arabicSearchText = convertEnglishToArabicNumbers(searchText);

          // البحث في جميع النسخ (الأصلية، الإنجليزية، العربية)
          return uniqueTerms.some(term => 
            searchText.includes(term) || 
            englishSearchText.includes(term) || 
            arabicSearchText.includes(term)
          );
        });
      }

      if (type === 'all' || type === 'accessories') {
        accessories = allAccessories.filter(a => {
          // إضافة الباركود و serial_number إلى البحث للأكسسوارات
          const searchText = `${a.name || ''} ${a.arabic_name || ''} ${a.barcode || ''} ${a.barcode_id || ''} ${a.serial_number || ''} ${a.category || ''}`.toLowerCase();
          const englishSearchText = convertArabicToEnglishNumbers(searchText);
          const arabicSearchText = convertEnglishToArabicNumbers(searchText);

          // البحث في جميع النسخ (الأصلية، الإنجليزية، العربية)
          return uniqueTerms.some(term => 
            searchText.includes(term) || 
            englishSearchText.includes(term) || 
            arabicSearchText.includes(term)
          );
        });
      }


      // حفظ النتائج وإعادة تعيين الصفحة الأولى
      currentSearchResults = { phones, accessories };
      currentPage = 1;
      
      renderResults(phones, accessories);

    } catch (error) {
      console.error('❌ خطأ في البحث:', error);
      showAlert('danger', 'حدث خطأ في البحث. حاول مرة أخرى.');
    }
  }

  // ===== العرض مع دعم الصفحات =====
  function renderResults(phones, accessories){
    const wrap = document.getElementById('results_wrap');
    const body = document.getElementById('results_body');
    const countEl = document.getElementById('results_count');

    const total = (phones?.length || 0) + (accessories?.length || 0);
    countEl.textContent = total;

    wrap.classList.remove('d-none');
    if (total === 0){
      body.innerHTML = `
        <div class="text-center py-4">
          <i class="fas fa-search fa-3x text-muted mb-3"></i>
          <h4 class="text-muted">لا توجد نتائج</h4>
          <p class="text-muted">لم يتم العثور على أي نتائج تطابق معايير البحث</p>
        </div>`;
      return;
    }

    // حساب عدد الصفحات
    totalPages = Math.ceil(total / ITEMS_PER_PAGE);
    
    // ادمج النوعين أولاً ثم طبّق الترقيم على القائمة الواحدة؛ تطبيق نفس
    // startIndex على كل نوع منفصلاً كان يتجاوز حجم الصفحة ويفقد نتائج.
    const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
    const endIndex = startIndex + ITEMS_PER_PAGE;

    const sortedPhones = (phones || []).slice().sort((a, b) => {
      const aId = a.id || a.phone_number || a.device_number || a.serial_number;
      const bId = b.id || b.phone_number || b.device_number || b.serial_number;
      const aSold = aId && isPhoneSold(String(aId));
      const bSold = bId && isPhoneSold(String(bId));
      if (aSold !== bSold) return aSold ? 1 : -1;
      return String(a.phone_number || '').localeCompare(String(b.phone_number || ''));
    });
    const pageItems = [
      ...sortedPhones.map(item => ({ type: 'phone', item })),
      ...(accessories || []).map(item => ({ type: 'accessory', item }))
    ].slice(startIndex, endIndex);
    const phonesForCurrentPage = pageItems.filter(x => x.type === 'phone').map(x => x.item);
    const accessoriesForCurrentPage = pageItems.filter(x => x.type === 'accessory').map(x => x.item);

    let html = '';

    // Phones - Sort by status: available first, then sold
    if (phonesForCurrentPage.length){
      html += `
        <div class="mb-4">
          <h6 class="text-primary mb-3">
            <i class="fas fa-mobile-alt"></i> الهواتف (${phones.length}) - الصفحة ${currentPage} من ${totalPages}
          </h6>
          <div class="table-responsive">
            <table class="table table-striped">
              <thead class="table-dark">
                <tr>
                  <th>الباركود/رقم الجهاز</th>
                  <th>الرقم التسلسلي</th>
                  <th>الشركة المصنعة</th>
                  <th>الموديل</th>
                  <th>الحالة</th>
                  <th>سعر الشراء</th>
                  <th>سعر البيع</th>
                  <th>الإجراءات</th>
                </tr>
              </thead>
              <tbody>
                ${phonesForCurrentPage.map(p => `
                  <tr>
                    <td><strong>${escapeHTML(p.phone_number || p.device_number || 'غير محدد')}</strong></td>
                    <td><span class="text-info">${escapeHTML(p.serial_number || 'غير محدد')}</span></td>
                    <td>${escapeHTML(p.manufacturer || p.brand || 'غير محدد')}</td>
                    <td>${escapeHTML(p.model || 'غير محدد')}</td>
                    <td>
                      ${
                        (() => {
                          const pid = p.id || p.phone_number || p.device_number || p.serial_number;
                          return (pid && isPhoneSold(String(pid)))
                            ? '<span class="badge bg-danger">مباع</span>'
                            : '<span class="badge bg-success">متاح</span>';
                        })()
                      }
                    </td>
                    <td><span class="text-success">${fmtMoney(p.purchase_price || 0)} ريال</span></td>
                    <td><span class="text-primary">${fmtMoney(p.selling_price || p.price || 0)} ريال</span></td>
                    <td>
                      <div class="btn-group" role="group">
                        <button type="button" class="btn btn-sm btn-outline-info" onclick="viewPhoneDetails(${actionArg(p.phone_number || p.id)})" title="عرض التفاصيل">
                          <i class="fas fa-eye"></i>
                        </button>
                        <button type="button" class="btn btn-sm btn-outline-primary" onclick="editPhone(${actionArg(p.phone_number || p.id)})" title="تعديل">
                          <i class="fas fa-edit"></i>
                        </button>
                        <!-- ✅ زر طباعة الباركود -->
                        <button type="button" class="btn btn-sm btn-outline-dark"
                                onclick="goPrintBarcode(${actionArg(p.phone_number || p.device_number || p.serial_number || p.id)})"
                                title="طباعة الباركود">
                          <i class="fas fa-barcode"></i>
                        </button>
                        <!-- ✅ زر حذف الجهاز -->
                        ${getCurrentRole() === 'admin' ? `<button type="button" class="btn btn-sm btn-outline-danger"
                                onclick="deletePhone(${actionArg(p.id || p.phone_number)})"
                                title="حذف الجهاز">
                          <i class="fas fa-trash"></i>
                        </button>` : ''}
                      </div>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>`;
    }

    // Accessories
    if (accessoriesForCurrentPage.length){
      html += `
        <div class="mb-4">
          <h6 class="text-success mb-3">
            <i class="fas fa-box"></i> الأكسسوارات (${accessories.length}) - الصفحة ${currentPage} من ${totalPages}
          </h6>
          <div class="table-responsive">
            <table class="table table-striped">
              <thead class="table-dark">
                <tr>
                  <th>الاسم</th>
                  <th>الباركود</th>
                  <th>الرقم التسلسلي</th>
                  <th>الفئة</th>
                  <th>الكمية</th>
                  <th>سعر الشراء</th>
                  <th>سعر البيع</th>
                  <th>الإجراءات</th>
                </tr>
              </thead>
              <tbody>
                ${accessoriesForCurrentPage.map(a => `
                  <tr>
                    <td><strong>${escapeHTML(a.arabic_name || a.name || 'غير محدد')}</strong></td>
                    <td><span class="text-info">${escapeHTML(a.barcode || 'غير محدد')}</span></td>
                    <td><span class="text-info">${escapeHTML(a.serial_number || 'غير محدد')}</span></td>
                    <td><span class="badge bg-primary">${escapeHTML(a.category || 'غير محدد')}</span></td>
                    <td><span class="badge bg-success">${Number(a.quantity_in_stock ?? a.quantity ?? 0) || 0}</span></td>
                    <td><span class="text-success">${fmtMoney(a.purchase_price || 0)} ريال</span></td>
                    <td><span class="text-primary">${fmtMoney(a.selling_price || 0)} ريال</span></td>
                    <td>
                      <div class="btn-group" role="group">
                        <button type="button" class="btn btn-sm btn-outline-info" onclick="viewAccessoryDetails(${actionArg(a.id)})" title="عرض التفاصيل">
                          <i class="fas fa-eye"></i>
                        </button>
                        <button type="button" class="btn btn-sm btn-outline-primary" onclick="editAccessory(${actionArg(a.id)})" title="تعديل">
                          <i class="fas fa-edit"></i>
                        </button>
                        ${a.barcode ? `<button type="button" class="btn btn-sm btn-outline-success" onclick="goPrintAccessoryBarcode(${actionArg(a.barcode)})" title="طباعة الباركود">
                          <i class="fas fa-barcode"></i>
                        </button>` : ''}
                        ${getCurrentRole() === 'admin' ? `<button type="button" class="btn btn-sm btn-outline-danger" onclick="deleteAccessory(${actionArg(a.id)})" title="حذف">
                          <i class="fas fa-trash"></i>
                        </button>` : ''}
                      </div>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>`;
    }

    // إضافة أزرار التنقل بين الصفحات
    if (totalPages > 1) {
      html += generatePaginationButtons();
    }

    wrap.classList.remove('d-none');
    body.innerHTML = html;
  }

  // ===== دوال الصفحات =====
  
  // إنشاء أزرار التنقل بين الصفحات
  function generatePaginationButtons() {
    let buttons = '';
    
    // زر الصفحة السابقة
    if (currentPage > 1) {
      buttons += `<button class="btn btn-outline-primary btn-sm" onclick="goToPage(${currentPage - 1})">
        <i class="fas fa-chevron-right"></i> السابق
      </button>`;
    }
    
    // أزرار الصفحات
    const startPage = Math.max(1, currentPage - 2);
    const endPage = Math.min(totalPages, currentPage + 2);
    
    if (startPage > 1) {
      buttons += `<button class="btn btn-outline-secondary btn-sm" onclick="goToPage(1)">1</button>`;
      if (startPage > 2) {
        buttons += `<span class="mx-2 text-muted">...</span>`;
      }
    }
    
    for (let i = startPage; i <= endPage; i++) {
      const isActive = i === currentPage ? 'btn-primary' : 'btn-outline-secondary';
      buttons += `<button class="btn ${isActive} btn-sm" onclick="goToPage(${i})">${i}</button>`;
    }
    
    if (endPage < totalPages) {
      if (endPage < totalPages - 1) {
        buttons += `<span class="mx-2 text-muted">...</span>`;
      }
      buttons += `<button class="btn btn-outline-secondary btn-sm" onclick="goToPage(${totalPages})">${totalPages}</button>`;
    }
    
    // زر الصفحة التالية
    if (currentPage < totalPages) {
      buttons += `<button class="btn btn-outline-primary btn-sm" onclick="goToPage(${currentPage + 1})">
        التالي <i class="fas fa-chevron-left"></i>
      </button>`;
    }
    
    return `
      <div class="d-flex justify-content-center mt-4 mb-4">
        <nav aria-label="تنقل الصفحات" class="pagination-nav">
          <div class="btn-group shadow-sm" role="group" style="border-radius: 8px; overflow: hidden;">
            ${buttons}
          </div>
        </nav>
      </div>
    `;
  }
  
  // الانتقال لصفحة محددة
  function goToPage(page) {
    if (page < 1 || page > totalPages || page === currentPage) return;
    
    currentPage = page;
    renderResults(currentSearchResults.phones, currentSearchResults.accessories);
    
    // التمرير لأعلى الصفحة
    document.getElementById('results_wrap').scrollIntoView({ behavior: 'smooth' });
  }

  // ===== دوال الإجراءات =====
  
  // عرض تفاصيل الهاتف
  function viewPhoneDetails(phoneNumber) {
    const phone = allPhones.find(p => p.phone_number === phoneNumber || p.id === phoneNumber);
    if (phone) {
      const details = `

الشركة المصنعة: ${phone.manufacturer || phone.brand || 'غير محدد'}
الموديل: ${phone.model || 'غير محدد'}
الحالة: ${phone.condition === 'new' || phone.phone_type === 'new' ? 'جديد' : 'مستعمل'}
سعر الشراء: ${fmtMoney(phone.purchase_price || 0)} ريال
سعر البيع: ${fmtMoney(phone.selling_price || phone.price || 0)} ريال
الربح: ${fmtMoney((phone.selling_price || phone.price || 0) - (phone.purchase_price || 0))} ريال
الذاكرة: ${phone.phone_memory || phone.memory || 'غير محدد'}
نسبة البطارية: ${phone.battery_level || phone.age || 'غير محدد'}
اللون: ${phone.phone_color || 'غير محدد'}
الرقم التسلسلي: ${phone.serial_number || 'غير محدد'}
الضمان: ${phone.warranty || 'غير محدد'} شهر
      `;
      alert(details);
    }
  }

  // تعديل الهاتف
  function editPhone(phoneNumber) {
    const phone = allPhones.find(p => p.phone_number === phoneNumber || p.id === phoneNumber);
    if (phone) {
      // توجيه إلى صفحة التعديل المخصصة
      window.location.href = `edit_phone.html?edit=${phoneNumber}`;
    }
  }

  // عرض تفاصيل الأكسسوار
  function viewAccessoryDetails(accessoryId) {
    const accessory = allAccessories.find(a => a.id === accessoryId);
    if (accessory) {
      const details = `
الاسم: ${accessory.arabic_name || accessory.name || 'غير محدد'}
الفئة: ${accessory.category || 'غير محدد'}
الكمية: ${Number(accessory.quantity_in_stock ?? accessory.quantity ?? 0) || 0}
سعر الشراء: ${fmtMoney(accessory.purchase_price || 0)} ريال
سعر البيع: ${fmtMoney(accessory.selling_price || 0)} ريال
المورد: ${accessory.supplier || 'غير محدد'}
الوصف: ${accessory.description || 'لا يوجد وصف'}
      `;
      alert(details);
    }
  }

  // تعديل الأكسسوار
  function editAccessory(accessoryId) {
    window.location.href = `edit_accessory.html?id=${accessoryId}`;
  }

  // حذف الأكسسوار
  async function deleteAccessory(accessoryId) {
    const accessory = allAccessories.find(a => a.id === accessoryId);
    if (!accessory) return;

    if (!confirm(`هل أنت متأكد من حذف "${accessory.arabic_name || accessory.name}"؟`)) return;

    try {
      if (window.storage && window.storage.isFirebaseAvailable) {
        const success = await window.storage.deleteAccessory(accessoryId);
        if (success) {
          allAccessories = allAccessories.filter(a => String(a.id) !== String(accessoryId));
          inventoryDataLoaded = false;
          showAlert('success', 'تم حذف الأكسسوار بنجاح');
          // إعادة البحث لعرض النتائج المحدثة
          document.getElementById('searchForm').dispatchEvent(new Event('submit'));
        } else {
          showAlert('danger', 'فشل في حذف الأكسسوار');
        }
      } else {
        showAlert('warning', 'Firebase غير متاح. لا يمكن حذف الأكسسوار.');
      }
    } catch (error) {
      console.error('❌ خطأ في حذف الأكسسوار:', error);
      showAlert('danger', 'حدث خطأ في حذف الأكسسوار');
    }
  }

  // عرض التنبيهات
  function showAlert(type, message) {
    const alertDiv = document.createElement('div');
    alertDiv.className = `alert alert-${type} alert-dismissible fade show position-fixed`;
    alertDiv.style.cssText = 'top: 20px; right: 20px; z-index: 9999; min-width: 300px;';
    alertDiv.innerHTML = `
      ${escapeHTML(message)}
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    `;
    
    document.body.appendChild(alertDiv);
    
    setTimeout(() => {
      if (alertDiv.parentNode) {
        alertDiv.remove();
      }
    }, 5000);
  }

  // التحقق من تسجيل الدخول
  function checkLogin() {
    const currentUser = localStorage.getItem('current_user');
    if (!currentUser) {
      alert('يجب تسجيل الدخول أولاً');
      window.location.href = 'login.html';
      return false;
    }
    return true;
  }

  // تهيئة الصفحة
  document.addEventListener('DOMContentLoaded', async function() {
    // إعداد دعم الأرقام العربية
    setupArabicNumberSupport();
    
    // التحقق من تسجيل الدخول أولاً
    if (!checkLogin()) return;

    // ملفات Firebase نوعها module وتُنفَّذ قبل إطلاق DOMContentLoaded،
    // لذا window.storage جاهز هنا دائماً ولا حاجة لأي انتظار.
    
    if (window.storage && window.storage.isFirebaseAvailable) {
    } else {
    }
    
    // لا تُظهر النتائج افتراضياً — تُعرض فقط بعد البحث أو عند النقر على "عرض الكل"
    
    // البحث التلقائي بالباركود إذا تم تمريره في URL
    const urlParams = new URLSearchParams(window.location.search);
    const barcode = urlParams.get('barcode');
    const type = urlParams.get('type');
    
    if (barcode) {
      document.getElementById('search_term').value = barcode;
      
      if (type) {
        document.getElementById('search_type').value = type === 'accessory' ? 'accessories' : 'phones';
      }
      
      // تنفيذ البحث تلقائياً
      setTimeout(() => {
        handleSearch({ preventDefault: () => {} });
      }, 500);
    }
  });

  // ===== طباعة الباركود =====
  function goPrintBarcode(rawCode) {
    const code = String(rawCode || '').trim();
    if (!code) { 
      showAlert('warning', 'لا يوجد رقم باركود صالح لهذا الجهاز'); 
      return; 
    }
    // ✅ نوجّه بنفس الشكل المطلوب
    window.location.href = `print_barcode.html?edit=${encodeURIComponent(code)}`;
  }

  // ===== طباعة باركود الإكسسوار =====
  function goPrintAccessoryBarcode(rawCode) {
    const code = String(rawCode || '').trim();
    if (!code) { 
      showAlert('warning', 'لا يوجد رقم باركود صالح لهذا الإكسسوار'); 
      return; 
    }
    // توجيه لصفحة طباعة باركود الإكسسوارات
    window.location.href = `print_accessory_barcode.html?barcode=${encodeURIComponent(code)}`;
  }

  // ===== حذف الجهاز =====
  async function deletePhone(phoneId) {
    
    if (!phoneId) {
      console.error('❌ معرف الجهاز غير صالح');
      showAlert('danger', 'معرف الجهاز غير صالح');
      return;
    }

    // العثور على الجهاز للتأكد من وجوده
    const phone = allPhones.find(p => p.id === phoneId || p.phone_number === phoneId);
    if (!phone) {
      console.error('❌ لم يتم العثور على الجهاز:', phoneId);
      showAlert('danger', 'لم يتم العثور على الجهاز المطلوب');
      return;
    }

    // التحقق من أن الجهاز غير مباع
    const phoneIdentifier = phone.id || phone.phone_number || phone.device_number || phone.serial_number;
    if (phoneIdentifier && isPhoneSold(String(phoneIdentifier))) {
      showAlert('warning', 'لا يمكن حذف جهاز تم بيعه مسبقاً');
      return;
    }

    // تأكيد الحذف
    const confirmMessage = `هل أنت متأكد من حذف هذا الجهاز؟

الجهاز: ${phone.manufacturer || phone.brand || 'غير محدد'} ${phone.model || 'غير محدد'}
الباركود: ${phone.phone_number || 'غير محدد'}
الرقم التسلسلي: ${phone.serial_number || 'غير محدد'}

⚠️ تحذير: هذا الإجراء لا يمكن التراجع عنه!`;

    if (!confirm(confirmMessage)) {
      return;
    }

    try {
      
      if (window.storage && window.storage.isFirebaseAvailable) {
        // حذف من Firebase
        await window.storage.deletePhone(phoneId);
      } else throw new Error('يلزم الاتصال بقاعدة البيانات لحذف الجهاز');

      // إعادة تحميل البيانات وعرض النتائج
      await loadAllData();
      inventoryDataLoaded = true;
      inventoryLoadedAt = Date.now();
      
      showAlert('success', 'تم حذف الجهاز بنجاح');
      
    } catch (error) {
      console.error('❌ خطأ في حذف الجهاز:', error);
      showAlert('danger', 'حدث خطأ في حذف الجهاز. حاول مرة أخرى.');
    }
  }

  window.addEventListener('online', () => { inventoryDataLoaded = false; });
  window.addEventListener('focus', () => {
    if (Date.now() - inventoryLoadedAt > INVENTORY_REFRESH_MS) inventoryDataLoaded = false;
  });
</script>
