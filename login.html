<body>

  <!-- شريط التنقل -->
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <span class="navbar-brand">الصقري للاتصالات</span>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link active" href="login.html"><i class="fas fa-right-to-bracket"></i> تسجيل الدخول</a>
          </li>
        </ul>

    </div>

<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card">
        <div class="card-header">
          <h3 class="text-center mb-0">تسجيل الدخول</h3>
        </div>
        <div class="card-body">
          <!-- نموذج تسجيل الدخول -->
          <form method="POST" action="#" onsubmit="handleLogin(event)">
            <div class="mb-3">
              <label for="username" class="form-label">اسم المستخدم</label>
              <input type="text" class="form-control" id="username" name="username" required>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">كلمة المرور</label>
              <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <div class="d-grid">
              <button type="submit" class="btn btn-primary">تسجيل الدخول</button>
            </div>
          </form>
          <!-- /form -->
        </div>
      </div>
    </div>
  </div>
</div>

<!-- مكتبات JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/pwa-register.js"></script>
<script>
  // عرض التنبيهات
  function showAlert(type, message) {
    const alertDiv = document.createElement('div');
    alertDiv.className = `alert alert-${type} alert-dismissible fade show position-fixed`;
    alertDiv.style.cssText = 'top: 20px; right: 20px; z-index: 9999; min-width: 300px;';
    alertDiv.innerHTML = `
      <i class="fas fa-${type === 'success' ? 'check-circle' : type === 'danger' ? 'exclamation-triangle' : 'info-circle'}"></i>
      ${escapeHTML(message)}
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    `;

    document.body.appendChild(alertDiv);

    setTimeout(() => {
      if (alertDiv.parentNode) {
        alertDiv.remove();
      }
    }, 4000);
  }
</script>

<script type="module">
  // تسجيل الدخول عبر Firebase Authentication — التحقق يتم على خوادم Firebase
  // لا توجد أي بيانات دخول في هذا الملف.
  import { signInWithEmailAndPassword, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

  const ACCOUNTS = {
    admin: { email: 'admin@alsaqri.store',  name: 'مدير النظام',   role: 'admin', dashboard: 'dashboard.html' },
    user:  { email: 'user@alsaqri.store',   name: 'موظف المبيعات', role: 'user',  dashboard: 'limited_dashboard.html' }
  };

  function saveSession(account, fbUser) {
    localStorage.setItem('current_user', JSON.stringify({
      username: account.email.split('@')[0],
      name: account.name,
      role: account.role,
      uid: fbUser ? fbUser.uid : null,
      loginTime: new Date().toISOString()
    }));
  }

  // جلسة قائمة مسبقاً → مزامنة الدور والتحويل مباشرة
  onAuthStateChanged(window.firebaseAuth, (fbUser) => {
    if (!fbUser) return;
    const email = (fbUser.email || '').toLowerCase();
    const account = Object.values(ACCOUNTS).find(a => a.email === email);
    if (!account) {
      // جلسة لا تنتمي لأحد الحسابين المعتمدين — خروج احتياطي
      window.firebaseSignOut(window.firebaseAuth).catch(() => {});
      localStorage.removeItem('current_user');
      return;
    }
    saveSessionAndGo(account, fbUser);
  });

  function saveSessionAndGo(account, fbUser) {
    saveSession(account, fbUser);
    window.location.href = account.dashboard;
  }

  // معالجة تسجيل الدخول
  window.handleLogin = function(e) {
    e.preventDefault();

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    if (!username || !password) {
      showAlert('danger', 'يرجى إدخال اسم المستخدم وكلمة المرور');
      return;
    }

    const account = ACCOUNTS[username];
    if (!account) {
      showAlert('danger', 'اسم المستخدم أو كلمة المرور غير صحيحة');
      return;
    }

    signInWithEmailAndPassword(window.firebaseAuth, account.email, password)
      .then(({ user: fbUser }) => {
        saveSessionAndGo(account, fbUser);
      })
      .catch((err) => {
        console.error('فشل تسجيل الدخول:', err && err.code);
        if (err && (err.code === 'auth/too-many-requests')) {
          showAlert('danger', 'محاولات كثيرة خاطئة — انتظر قليلاً ثم أعد المحاولة');
        } else {
          showAlert('danger', 'اسم المستخدم أو كلمة المرور غير صحيحة');
        }
      });
  };
</script>
</body>
</html>
